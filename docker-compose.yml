services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-isotopeiq}
      POSTGRES_USER: ${DB_USER:-isotopeiq}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DATA_POSTGRES:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-isotopeiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ${DATA_REDIS:-./data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: isotopeiq-satellite/backend:latest
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${DATA_STATICFILES:-./data/staticfiles}:/app/staticfiles
      - ${DATA_AGENTS:-./agents}:/agents:ro
      - ${LDAP_CA_CERTS_DIR:-/etc/ssl/certs}:/etc/ssl/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/users/me/\")' 2>&1 | grep -qv 'Connection refused' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        python manage.py ensure_admin &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120

  celery_worker:
    image: isotopeiq-satellite/backend:latest
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${LDAP_CA_CERTS_DIR:-/etc/ssl/certs}:/etc/ssl/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A config worker -l info -Q isotopeiq_satellite_2

  celery_beat:
    image: isotopeiq-satellite/backend:latest
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${LDAP_CA_CERTS_DIR:-/etc/ssl/certs}:/etc/ssl/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  nginx:
    build:
      context: ./nginx
    image: isotopeiq-satellite/nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ${DATA_TLS:-./data/tls}:/etc/nginx/tls
      - ${DATA_STATICFILES:-./data/staticfiles}:/app/staticfiles:ro
      # To use your own certificate, uncomment and set the paths:
      # - /path/to/server.crt:/etc/nginx/tls/server.crt:ro
      # - /path/to/server.key:/etc/nginx/tls/server.key:ro
    depends_on:
      - backend

# Data directories are configured via DATA_* variables in .env.
# Defaults: ./data/postgres  ./data/redis  ./data/staticfiles  ./data/tls
# Back up by copying those directories. Never run 'docker compose down -v'.
