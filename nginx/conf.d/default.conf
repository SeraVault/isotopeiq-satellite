# ─────────────────────────────────────────────────────────────────────────────
# IsotopeIQ Satellite — nginx reverse proxy
#
# HTTP  (80)  → redirect to HTTPS
# HTTPS (443) → frontend SPA + backend API/admin/saml2/ws
#
# TLS certificate is auto-generated on first start (self-signed).
# To use your own certificate, mount it into the container:
#
#   volumes:
#     - /path/to/server.crt:/etc/nginx/tls/server.crt:ro
#     - /path/to/server.key:/etc/nginx/tls/server.key:ro
# ─────────────────────────────────────────────────────────────────────────────

upstream iq_backend {
    server backend:8000;
    keepalive 32;
}

# ── HTTP — redirect everything to HTTPS ──────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name _;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    client_max_body_size 50M;

    # ── Django static files — served directly from shared volume ──────────────
    location /static/ {
        alias   /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend: API, admin panel, SAML2, agent downloads ─────────────────────
    location ~ ^/(api|admin|saml2)/ {
        proxy_pass         http://iq_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
    }

    # ── WebSocket ──────────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://iq_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── Vue SPA (all other requests) ──────────────────────────────────────────
    # Served directly from the staticfiles volume.  collectstatic copies the
    # pre-built Vue dist there at container startup alongside Django's own
    # admin/DRF assets.  Vue Router history-mode is supported via try_files.
    location / {
        root      /app/staticfiles;
        try_files $uri $uri/ /index.html;
        expires   1h;
        add_header Cache-Control "public";
    }

    # ── Deny hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }
}
