name: Build Windows Baseline Exporter

on:
  push:
    paths:
      - 'agents/windows_baseline_export.py'
      - '.github/workflows/build-windows-baseline-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Test exporter output on the actual Windows runner ──────────────────────
  test:
    name: Test exporter
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Run exporter + validate
        shell: pwsh
        run: |
          python agents\windows_baseline_export.py -o $env:TEMP\baseline.json 2> $env:TEMP\errors.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content $env:TEMP\errors.txt
            exit 1
          }
          python .github\scripts\validate_baseline.py $env:TEMP\baseline.json

      - name: Upload output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-baseline-export-output
          path: ${{ env.TEMP }}\baseline.json
          retention-days: 7

  # ── Build executable ───────────────────────────────────────────────────────
  build:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up 32-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: |
          cd agents
          pyinstaller --onefile --name windows_baseline_export windows_baseline_export.py
          if (Test-Path windows_baseline_export.exe) { Remove-Item windows_baseline_export.exe }
          move dist\windows_baseline_export.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-baseline-export
          path: agents/windows_baseline_export.exe
          retention-days: 30

  # ── Build XP-compatible executable ─────────────────────────────────────────
  # Python 3.8 executables refuse to load on Windows XP ("not a valid Win32
  # application"). Python 3.4.4 is the last release that runs on XP, and
  # PyInstaller 3.4 is the last release that supports Python 3.4.
  build-xp:
    name: Build XP executable
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit Python 3.4.4
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.python.org/ftp/python/3.4.4/python-3.4.4.msi -OutFile python344.msi
          Start-Process msiexec -ArgumentList '/i','python344.msi','/qn','ALLUSERS=1','TARGETDIR=C:\Python34' -Wait
          Invoke-WebRequest https://bootstrap.pypa.io/pip/3.4/get-pip.py -OutFile get-pip.py
          C:\Python34\python.exe get-pip.py

      - name: Install PyInstaller 3.4
        run: C:\Python34\python.exe -m pip install "pyinstaller==3.4" "pefile==2019.4.18" "altgraph==0.16.1" "pywin32-ctypes==0.2.0" "future==0.18.2"

      - name: Build executable
        run: |
          cd agents
          C:\Python34\python.exe -m PyInstaller --onefile --name windows_baseline_export_xp windows_baseline_export.py
          if (Test-Path windows_baseline_export_xp.exe) { Remove-Item windows_baseline_export_xp.exe }
          move dist\windows_baseline_export_xp.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-baseline-export-xp
          path: agents/windows_baseline_export_xp.exe
          retention-days: 30

  commit-binary:
    name: Commit binaries
    needs: [build, build-xp]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-baseline-export
          path: agents/

      - name: Download XP artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-baseline-export-xp
          path: agents/

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop
          git add agents/windows_baseline_export.exe agents/windows_baseline_export_xp.exe
          git diff --cached --quiet && echo "No binary changes." || \
            git commit -m "chore: rebuild windows baseline exporter binaries [skip ci]"
          git push
